version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: service-booking-postgres
    env_file:
      - .env
    ports:

      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: service-booking-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres

volumes:

  postgres_data:

